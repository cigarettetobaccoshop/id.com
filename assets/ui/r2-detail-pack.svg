<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Studio Terang (Soft Blue-White) -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2ecfb" />
    </linearGradient>

    <!-- Base Box Biru Premium (Matte Finish) -->
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b67c8" />
      <stop offset="50%" stop-color="#0b3f95" />
      <stop offset="100%" stop-color="#041b47" />
    </linearGradient>

    <!-- Tutup Atas Putih/Silver Mengkilap -->
    <linearGradient id="silverLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4F8FF" />
      <stop offset="100%" stop-color="#D0DEF2" />
    </linearGradient>

    <!-- Gradasi Aksen Emas/Tembaga Opsional (Pita Cukai) -->
    <linearGradient id="cukaiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#34495e" />
    </linearGradient>

    <!-- Drop Shadow Realistis di Bawah Box -->
    <filter id="mainShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="30" stdDeviation="22" flood-color="#061d45" flood-opacity="0.35"/>
    </filter>

    <!-- Shadow untuk Badge / Tombol -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Clip Path untuk Radius Pinggiran Bungkus Rokok -->
    <clipPath id="boxRadius">
      <rect x="230" y="135" width="340" height="530" rx="16" />
    </clipPath>
  </defs>

  <!-- Latar Belakang Studio -->
  <rect width="100%" height="100%" fill="url(#studioBg)" />
  <!-- Aksen Cahaya Lingkaran (Bokeh) -->
  <circle cx="650" cy="150" r="280" fill="#1f72d0" opacity="0.04" />
  <circle cx="150" cy="650" r="200" fill="#0b3d91" opacity="0.03" />

  <!-- Base Box (Menghasilkan Shadow) -->
  <rect x="230" y="135" width="340" height="530" rx="16" fill="url(#boxBlue)" filter="url(#mainShadow)" />

  <!-- Konten Dalam Box (Dipotong Otomatis oleh Sudut Melengkung) -->
  <g clip-path="url(#boxRadius)">
    
    <!-- Warna Body Utama -->
    <rect x="230" y="135" width="340" height="530" fill="url(#boxBlue)" />
    <!-- Tekstur Halus Body (Pattern/Overlay Opsional) -->
    <path d="M 230 135 L 570 665 L 570 135 Z" fill="#ffffff" opacity="0.02" />

    <!-- Tutup Bagian Atas (Putih/Silver) -->
    <rect x="230" y="135" width="340" height="150" fill="url(#silverLid)" />

    <!-- Garis Lipatan Tutup (Lid Crease) -->
    <line x1="230" y1="285" x2="570" y2="285" stroke="#000000" stroke-width="2" opacity="0.25" />
    <line x1="230" y1="287" x2="570" y2="287" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Segel / Pita Cukai di Kanan Atas -->
    <rect x="470" y="135" width="75" height="50" fill="#E8F0FE" />
    <rect x="475" y="135" width="65" height="45" fill="none" stroke="url(#cukaiGold)" stroke-width="1.5" />
    <line x1="470" y1="160" x2="545" y2="160" stroke="#0b3f95" stroke-width="3" />
    <text x="507" y="177" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#0b3f95" text-anchor="middle" letter-spacing="1">CUKAI RI</text>

    <!-- Teks Brand Atas: R2 -->
    <text x="403" y="243" font-family="Arial, sans-serif" font-size="75" font-weight="900" fill="#000000" opacity="0.1" text-anchor="middle" letter-spacing="2">R2</text>
    <text x="400" y="240" font-family="Arial, sans-serif" font-size="75" font-weight="900" fill="#0b3f95" text-anchor="middle" letter-spacing="2">R2</text>

    <!-- Teks Utama Body: NUSANTARA -->
    <text x="402" y="372" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#000000" opacity="0.3" text-anchor="middle" letter-spacing="4">NUSANTARA</text>
    <text x="400" y="370" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">NUSANTARA</text>
    
    <!-- Sub-teks: WHOLESALE -->
    <text x="400" y="415" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#8cb3eb" text-anchor="middle" letter-spacing="6">WHOLESALE</text>

    <!-- Elemen Garis Dekoratif -->
    <line x1="310" y1="465" x2="490" y2="465" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="320" y1="480" x2="480" y2="480" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="330" y1="495" x2="470" y2="495" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2"/>

    <!-- Tombol / Badge "READY STOCK" -->
    <rect x="290" y="555" width="220" height="55" rx="27.5" fill="#ffffff" filter="url(#badgeShadow)" />
    <!-- Aksen Garis Dalam Tombol -->
    <rect x="295" y="560" width="210" height="45" rx="22.5" fill="none" stroke="#0b3f95" stroke-width="1.5" opacity="0.2"/>
    <text x="400" y="589" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3f95" text-anchor="middle" letter-spacing="2">READY STOCK</text>

    <!-- EFEK ILUSI 3D (Highlight Kiri & Shadow Kanan) -->
    <!-- Pantulan Cahaya Plastik (Kiri) -->
    <path d="M 230 135 L 275 135 L 250 665 L 230 665 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 275 135 L 295 135 L 270 665 L 250 665 Z" fill="#ffffff" opacity="0.1" />
    
    <!-- Bayangan Volume Box (Kanan) -->
    <path d="M 540 135 L 570 135 L 570 665 L 520 665 Z" fill="#000000" opacity="0.2" />
    <line x1="567" y1="135" x2="567" y2="665" stroke="#000000" stroke-width="2" opacity="0.25"/>

  </g>

  <!-- Label Watermark (Background Kiri Bawah) -->
  <text x="50" y="730" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="5" fill="#0b3f95" opacity="0.8">R2 WHOLESALE</text>
  <text x="50" y="755" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1f72d0">DISTRIBUTOR RESMI</text>

</svg>
