name: Protected Cleanup Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/protected-dependency-audit.js'
      - '.github/workflows/protected-cleanup.yml'

permissions:
  contents: read

jobs:
  protected-cleanup:
    name: Dependency scan + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protected dependency scan
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run audit:protected-deps

      - name: Production build
        run: npm run build
