name: Protected cleanup audit

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "package-lock.json"
      - ".github/workflows/protected-cleanup.yml"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency safety audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run protected cleanup audit
        run: node scripts/protected-dependency-audit.js --base "${{ github.event.pull_request.base.sha }}"

  build:
    name: Production build validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
