name: R2 Hero Deep Navy Visual Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hero:
    if: ${{ !contains(github.event.head_commit.message, '[hero-navy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply controlled deep-navy hero layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('style.css')
          css=p.read_text(encoding='utf-8')
          marker='/* R2 NUSANTARA — DEEP NAVY HERO v1 */'
          if marker not in css:
              css += r'''

/* R2 NUSANTARA — DEEP NAVY HERO v1 */
:root{
  --r2-deep-navy:#071a33;
  --r2-navy:#0a2342;
  --r2-navy-2:#0d2e55;
  --r2-blue:#2b72b8;
  --r2-white:#f8fbff;
  --r2-gold:#d8b56a;
}
#beranda{
  isolation:isolate;
  color:var(--r2-white);
  background:#071a33;
}
#beranda .hero-bg{
  z-index:-3;
  background:
    linear-gradient(135deg,rgba(4,16,32,.985) 0%,rgba(7,26,51,.965) 42%,rgba(10,35,66,.93) 100%),
    radial-gradient(circle at 78% 28%,rgba(49,123,194,.28),transparent 34%),
    url('assets/logo/hero-bg.jpg') center/cover no-repeat!important;
  opacity:1!important;
}
#beranda::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 78% 18%,rgba(80,155,222,.18),transparent 32%),
    radial-gradient(ellipse at 18% 88%,rgba(27,92,151,.18),transparent 36%),
    linear-gradient(90deg,rgba(4,17,34,.22),transparent 52%,rgba(5,18,36,.12));
}
#beranda::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.42),transparent 72%);
}
#beranda h1{color:#f8fbff!important;text-shadow:0 8px 35px rgba(0,0,0,.25)}
#beranda h1 .shine-text{
  background:linear-gradient(90deg,#fff 0%,#d8b56a 45%,#fff 72%,#8fc7f4 100%);
  background-size:280% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
#beranda #typewriterText{color:rgba(232,241,250,.78)!important;border-right-color:rgba(216,181,106,.9)!important}
#beranda .trust-badge,#beranda .live-visitor-badge{
  color:#dceafa!important;
  background:rgba(255,255,255,.075)!important;
  border-color:rgba(255,255,255,.16)!important;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 40px -24px rgba(0,0,0,.7);
}
#beranda .hero-trust i{filter:drop-shadow(0 0 8px rgba(216,181,106,.22))}
#beranda .btn-gradient{
  background:linear-gradient(135deg,#1f6fb2 0%,#14528d 55%,#0c3158 100%)!important;
  border:1px solid rgba(143,200,247,.22)!important;
  box-shadow:0 18px 45px -24px rgba(24,109,180,.72),inset 0 1px 0 rgba(255,255,255,.12)!important;
}
#beranda .btn-gradient:hover{background:linear-gradient(135deg,#2b83cc,#145a99)!important}
#beranda .btn-outline{
  color:#eef7ff!important;
  background:rgba(255,255,255,.055)!important;
  border-color:rgba(255,255,255,.2)!important;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#beranda .btn-outline:hover{color:#fff!important;background:rgba(255,255,255,.1)!important;border-color:rgba(216,181,106,.55)!important}
#beranda .watermark-float{opacity:.085;filter:brightness(2.1) saturate(.55);mix-blend-mode:screen}
#beranda .hero-blob{opacity:.34;filter:blur(85px)}
#beranda .blob-1{background:radial-gradient(circle at 30% 30%,rgba(56,131,199,.55),transparent 66%)}
#beranda .blob-2{background:radial-gradient(circle at 60% 40%,rgba(18,72,126,.65),transparent 66%)}
#beranda .hero-card{border-color:rgba(255,255,255,.14)!important;box-shadow:0 35px 100px -42px rgba(0,0,0,.8)!important}
#beranda .float-chip{background:rgba(8,27,51,.78)!important;color:#eaf4ff!important;border-color:rgba(255,255,255,.12)!important;box-shadow:0 20px 55px -24px rgba(0,0,0,.72)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#beranda .float-chip .text-slate-500{color:#9eb7cf!important}
#beranda .float-chip .text-deep{color:#f7fbff!important}
@media(max-width:767px){
  #beranda{padding-top:9.5rem!important;padding-bottom:3.75rem!important}
  #beranda .hero-bg{background:linear-gradient(160deg,rgba(4,16,32,.99),rgba(7,26,51,.95) 58%,rgba(10,35,66,.93)),url('assets/logo/hero-bg.jpg') center/cover no-repeat!important}
  #beranda .hero-blob{filter:blur(60px);opacity:.28}
  #beranda .float-chip{transform:scale(.9);transform-origin:center}
}
@media(prefers-reduced-motion:reduce){#beranda .watermark-float,#beranda .hero-blob{animation:none!important}}
'''
              p.write_text(css,encoding='utf-8')
          PY
          git config user.name 'R2 NUSANTARA Upgrade Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git diff --cached --quiet || git commit -m '[hero-navy] redesign homepage hero with deep navy transparent visual'
          git push
