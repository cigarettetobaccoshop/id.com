name: Sync lockfile for ESLint configuration
on:
  push:
    branches:
      - fix/next16-eslint-lint-config
    paths:
      - package.json
permissions:
  contents: write
jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize lockfile for ESLint"
          git push
